<style>
  :root {
    --paper: #F1E1CD;
    --maroon: #7E2142;
    --ink: #4A3B35;
    --gold: #C59A4E;
    --gold-light: #E3C48A;
    --rose: #B9787E;
    --display: "Cormorant Garamond", "Times New Roman", Georgia, serif;
    --body: "EB Garamond", Georgia, "Times New Roman", serif;
    --script: "Great Vibes", "Snell Roundhand", cursive;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body {
    color: var(--ink); font-family: var(--body); font-size: 1.08rem; line-height: 1.55;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 10px calc(24px + env(safe-area-inset-bottom, 0px));
    background:
      radial-gradient(circle at 12% 4%, rgba(255,214,150,.55) 0 18px, transparent 46px),
      radial-gradient(circle at 86% 8%, rgba(255,226,170,.5) 0 24px, transparent 58px),
      radial-gradient(circle at 6% 30%, rgba(255,190,110,.4) 0 26px, transparent 64px),
      radial-gradient(circle at 94% 42%, rgba(255,210,140,.45) 0 20px, transparent 52px),
      radial-gradient(circle at 8% 62%, rgba(255,205,135,.4) 0 22px, transparent 58px),
      radial-gradient(circle at 92% 78%, rgba(255,220,160,.4) 0 16px, transparent 44px),
      radial-gradient(circle at 14% 94%, rgba(255,214,150,.45) 0 20px, transparent 52px),
      linear-gradient(180deg, #5E3F28, #3E2817 50%, #2E1C12);
  }
  body.locked { overflow: hidden; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Paper card ---------- */
  .card {
    position: relative; max-width: 560px; margin: 0 auto 24px; overflow: hidden; text-align: center;
    background: var(--paper);
    box-shadow: inset 0 0 60px rgba(190,150,105,.28), 0 18px 40px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
  }
  .frame { position: absolute; inset: 9px; border: 1.5px solid var(--gold); pointer-events: none; z-index: 0; }
  .frame::after { content: ""; position: absolute; inset: 4px; border: 1px solid rgba(197,154,78,.55); }
  .frame i { position: absolute; width: 10px; height: 10px; background: var(--gold); transform: rotate(45deg); }
  .frame i:nth-child(1) { left: -6px; top: 50%; } .frame i:nth-child(2) { right: -6px; top: 50%; }
  .corner { position: absolute; top: 0; width: 40%; max-width: 230px; pointer-events: none; z-index: 1; }
  .corner.tl { left: 0; }
  .corner.tr { right: 0; }
  .garland { position: absolute; top: 0; left: 0; width: 100%; height: auto; z-index: 1; pointer-events: none; overflow: visible; }
  .content { position: relative; z-index: 2; }

  /* Arch frame */
  .arch { position: relative; margin: 74px 9% 0; padding: 70px 1.2rem 0; }
  .arch-top { position: absolute; top: 0; left: 0; width: 100%; height: 110px; overflow: visible; }
  .arch::before, .arch::after { content: ""; position: absolute; top: 108px; bottom: -30px; width: 1.5px; background: linear-gradient(var(--gold) 75%, transparent); }
  .arch::before { left: 0; } .arch::after { right: 0; }
  .ornament { display: block; width: 120px; height: 34px; margin: -38px auto 4px; }

  /* Ganesha with prabhavali */
  .deity { position: relative; width: 54%; max-width: 240px; margin: 18px auto 0; }
  .deity img { display: block; width: 100%; height: auto; }
  .deity .aura { position: absolute; left: 20%; right: 20%; top: 0; height: 52%; border-radius: 50%; background: radial-gradient(circle, rgba(255,222,150,.55), transparent 70%); mix-blend-mode: screen; animation: aura 4s ease-in-out infinite alternate; pointer-events: none; }
  .deity .prabha { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  @keyframes aura { from { opacity: .45; transform: scale(.95); } to { opacity: 1; transform: scale(1.06); } }
  .twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 2.6s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: .2; transform: scale(.5); } 50% { opacity: 1; transform: scale(1); } }

  /* Hanging lamps */
  .lamp { position: absolute; top: 0; width: 12%; max-width: 72px; z-index: 3; pointer-events: none; transform-origin: 50% 0; animation: sway 4s ease-in-out infinite alternate; }
  .lamp.l { left: 1.5%; }
  .lamp.r { right: 1.5%; animation-delay: -2s; }
  .lamp .chain { display: block; width: 2px; margin: 0 auto; height: var(--chain); background: repeating-linear-gradient(#B8893E 0 5px, #8A6328 5px 7px); }
  .lamp img { display: block; width: 100%; height: auto; margin-top: -8px; }
  .lamp .flame-glow { position: absolute; left: -30%; right: -30%; bottom: 8%; height: 45%; border-radius: 50%; background: radial-gradient(ellipse, rgba(255,200,90,.55), transparent 65%); mix-blend-mode: screen; animation: flick 1.4s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-1.6deg); } to { transform: rotate(1.6deg); } }
  @keyframes flick { 0% { opacity: .5; } 40% { opacity: 1; } 70% { opacity: .7; } 100% { opacity: .95; } }

  .vine { position: absolute; width: 11%; max-width: 64px; z-index: 1; pointer-events: none; }
  .vine.l { left: 3%; }
  .vine.r { right: 3%; transform: scaleX(-1); }

  /* Text */
  .blessing { font-family: "Tiro Kannada", serif; color: var(--maroon); font-size: 1rem; margin-top: .6rem; }
  .lead { max-width: 30ch; margin: .5rem auto 0; font-size: 1.12rem; }
  .title {
    display: block; width: max-content; margin: .7rem 0 0 50%; transform: translateX(-50%); padding: .1em .35em; white-space: nowrap;
    font-family: var(--display); font-weight: 700; font-size: clamp(1.8rem, 8vw, 3.3rem); line-height: 1; letter-spacing: .05em;
    background: linear-gradient(110deg, var(--maroon) 40%, #D7A85C 50%, var(--maroon) 60%) 0 0 / 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: glint 5s ease-in-out infinite;
  }
  @keyframes glint { 0%, 20% { background-position: 100% 0; } 80%, 100% { background-position: 0 0; } }
  .script {
    display: inline-block; padding: .12em .6em .38em; max-width: 100%;
    font-family: var(--script); font-weight: 400; line-height: 1.15;
    background: linear-gradient(180deg, #D9AEA6 0%, #B9787E 45%, #94545A 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .title-script { display: block; width: max-content; white-space: nowrap; margin: -.15em 0 -.2em 50%; transform: translateX(-50%); padding-left: .45em; padding-right: .45em; font-size: clamp(2.8rem, 12.5vw, 4.4rem); }
  .small-caps { font-family: var(--display); font-weight: 700; color: var(--maroon); letter-spacing: .16em; font-size: 1.1rem; }
  .names { font-family: var(--display); font-weight: 700; color: var(--maroon); font-size: clamp(1.45rem, 6.4vw, 2rem); line-height: 1.2; letter-spacing: .04em; margin-top: .3rem; }
  .names .and { display: block; width: fit-content; margin: 0 auto; padding: .05em .4em .25em; font-family: var(--script); font-weight: 400; color: var(--rose); font-size: 1.5em; letter-spacing: 0; line-height: 1.1; }
  .couple { position: relative; width: 54%; max-width: 240px; margin: 1rem auto 0; animation: float 5s ease-in-out infinite alternate; }
  .couple img { display: block; width: 100%; height: auto; }
  .bump-glow { position: absolute; left: 30%; top: 37%; width: 26%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, rgba(255,214,170,.7), rgba(255,190,200,.25) 45%, transparent 70%); mix-blend-mode: screen; animation: bump 3s ease-in-out infinite alternate; pointer-events: none; }
  .couple .float-up { top: 40%; }
  .couple .spark { position: absolute; color: #D2A85A; font-size: 12px; pointer-events: none; animation: twinkle 2.6s ease-in-out infinite; }
  @keyframes float { from { transform: translateY(0); } to { transform: translateY(-6px); } }
  @keyframes bump { from { opacity: .35; transform: scale(.85); } to { opacity: 1; transform: scale(1.12); } }
  .note { max-width: 30ch; margin: .6rem auto 0; font-size: 1.1rem; font-style: italic; }
  .datebox { position: relative; margin: 1.6rem auto 0; padding: 1rem .5rem; max-width: 330px; border-top: 1px solid var(--gold); border-bottom: 1px solid var(--gold); }
  .datebox::before, .datebox::after { content: ""; position: absolute; left: 50%; width: 9px; height: 9px; margin-left: -4.5px; background: var(--gold); transform: rotate(45deg); }
  .datebox::before { top: -5px; } .datebox::after { bottom: -5px; }
  .weekday { font-family: var(--display); font-weight: 600; letter-spacing: .5em; text-indent: .5em; font-size: 1rem; }
  .date { font-family: var(--display); font-weight: 700; color: var(--maroon); font-size: clamp(1.6rem, 7vw, 2.15rem); letter-spacing: .04em; line-height: 1.2; }
  .time { font-family: var(--display); font-weight: 700; letter-spacing: .14em; font-size: 1.1rem; }
  .at { font-family: var(--display); font-weight: 700; color: var(--maroon); letter-spacing: .1em; font-size: 1.05rem; line-height: 1.35; margin: 1.2rem auto 0; max-width: 26ch; }
  address { font-style: normal; max-width: 30ch; margin: .35rem auto 0; font-size: 1.05rem; }

  .rangoli { display: block; width: 46%; max-width: 230px; margin: 1.2rem auto 0; }
  .bottom-art { position: relative; height: clamp(150px, 42vw, 230px); }
  .kalasha { position: absolute; bottom: 0; width: 28%; max-width: 150px; z-index: 1; }
  .kalasha.l { left: 0; } .kalasha.r { right: 0; }
  .petals-static { position: absolute; left: 25%; right: 25%; bottom: 16px; height: 30px; }
  .petals-static svg { position: absolute; filter: drop-shadow(0 1px 1px rgba(80,40,20,.15)); }

  /* ---------- Card two ---------- */
  .card.two .content { padding: 92px 1.5rem 0; }
  .sec { padding: 1.2rem 0; }
  .palna { position: relative; width: min(330px, 100%); margin: 0 auto; }
  .palna svg { display: block; width: 100%; height: auto; overflow: visible; }
  .swing { transform-box: view-box; transform-origin: 160px 60px; animation: swing 3.2s ease-in-out infinite alternate; }
  @keyframes swing { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
  .parrot { transform-box: view-box; transform-origin: 160px 58px; animation: swing 2.3s ease-in-out infinite alternate-reverse; }
  .bell-s { transform-box: fill-box; transform-origin: 50% 0; animation: bell 1.6s ease-in-out infinite alternate; }
  @keyframes bell { from { transform: rotate(-12deg); } to { transform: rotate(12deg); } }
  .breath { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.06); } }
  .kick { transform-box: fill-box; transform-origin: 0% 50%; animation: kick 4s ease-in-out infinite; }
  .kick.b { animation-delay: -.4s; }
  @keyframes kick { 0%, 70%, 100% { transform: rotate(0); } 76% { transform: rotate(-18deg); } 82% { transform: rotate(10deg); } 88% { transform: rotate(-12deg); } }
  .wave { transform-box: fill-box; transform-origin: 30% 100%; animation: wave 5s ease-in-out infinite; }
  @keyframes wave { 0%, 60%, 100% { transform: rotate(0); } 66% { transform: rotate(-20deg); } 72% { transform: rotate(8deg); } 78% { transform: rotate(-14deg); } }
  .smile { transform-box: fill-box; transform-origin: center; animation: smile 6s ease-in-out infinite; }
  @keyframes smile { 0%, 55%, 100% { transform: scale(1, 1); } 62%, 85% { transform: scale(1.35, 1.8); } }
  .float-up { position: absolute; pointer-events: none; font-size: 14px; opacity: 0; animation: rise 4.5s ease-in infinite; }

  .feet-row { display: flex; align-items: center; justify-content: center; gap: .6rem; margin-top: .4rem; }
  .bangles { width: 48px; flex: none; }
  .bangles svg { width: 100%; height: auto; display: block; }
  .shine { stroke-dasharray: 14 220; animation: shine 3s linear infinite; }
  @keyframes shine { to { stroke-dashoffset: -234; } }
  .feet { display: flex; gap: 8px; height: 48px; }
  .foot { width: 15px; opacity: 0; animation: step 6s ease-in-out infinite; }
  .foot:nth-child(odd) { margin-top: 12px; }
  .foot svg { width: 100%; height: auto; display: block; }
  @keyframes step { 0% { opacity: 0; transform: scale(.6); } 8% { opacity: 1; transform: scale(1); } 60% { opacity: 1; } 75%, 100% { opacity: 0; } }
  .blessing-line { font-size: clamp(2.1rem, 9.5vw, 3rem); margin-top: .3rem; }

  .divider { display: block; width: 150px; height: 34px; margin: .2rem auto; }

  .countdown { display: flex; justify-content: center; gap: .55rem; margin-top: .4rem; }
  .ring { width: 66px; height: 66px; border-radius: 50%; display: grid; place-content: center; border: 1.5px solid var(--gold); box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 4px rgba(197,154,78,.55); background: radial-gradient(circle, #F8EDDD, var(--paper)); }
  .ring b { font-family: var(--display); font-weight: 700; font-size: 1.7rem; line-height: 1; color: var(--maroon); font-variant-numeric: lining-nums tabular-nums; }
  .ring small { font-family: var(--display); font-weight: 700; letter-spacing: .12em; font-size: .62rem; }
  .countdown p { font-family: var(--display); font-style: italic; font-size: 1.3rem; color: var(--maroon); }

  .map-art { display: block; margin-top: 1rem; border: 1px solid var(--gold); padding: 5px; background: #F7ECDD; }
  .map-art svg { display: block; width: 100%; height: auto; }
  .pin { animation: bob 1.6s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-5px); } }
  .live-map { margin-top: 1rem; border: 1px solid var(--gold); aspect-ratio: 4 / 3; background: #F7ECDD; }
  .live-map iframe { width: 100%; height: 100%; border: 0; display: block; }
  .awaiting { font-size: clamp(2.3rem, 10.5vw, 3.4rem); line-height: 1.15; }

  /* Buttons */
  .btn {
    display: inline-block; margin-top: 1rem; padding: .7rem 1.5rem; cursor: pointer; text-decoration: none;
    font-family: var(--display); font-weight: 700; font-size: 1.05rem; letter-spacing: .1em; line-height: 1.3;
    color: #FFF6EA; background: var(--maroon); border: 1px solid var(--gold); border-radius: 2px;
    box-shadow: inset 0 0 0 3px var(--maroon), inset 0 0 0 4px rgba(227,196,138,.6);
  }
  .btn:hover { background: #932A50; }
  .btn.ghost { background: transparent; color: var(--maroon); border-color: var(--maroon); box-shadow: none; }
  .btn.ghost:hover { background: rgba(126,33,66,.07); }
  .btn:focus-visible, .music:focus-visible, .map-art:focus-visible { outline: 2px solid var(--maroon); outline-offset: 3px; }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 .7rem; }

  .js .reveal { opacity: 0; transform: translateY(20px); transition: opacity 1s ease, transform 1s ease; }
  .js .reveal.in { opacity: 1; transform: none; }

  /* ---------- Opening ---------- */
  .intro { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 1.25rem; transition: opacity .9s ease; background: inherit; }
  .intro-card { position: relative; width: min(360px, 100%); padding: 150px 1.5rem 2.25rem; text-align: center; overflow: hidden; transition: transform 1s cubic-bezier(.5,0,.2,1), opacity 1s ease;
    background: var(--paper); box-shadow: inset 0 0 50px rgba(190,150,105,.28), 0 24px 50px rgba(0,0,0,.5); }
  .intro-card .corner { width: 46%; }
  .intro-card .title { font-size: clamp(1.8rem, 8vw, 2.4rem); }
  .intro-card .title-script { font-size: clamp(2.8rem, 12vw, 3.4rem); }
  .intro-card .content > * { position: relative; }
  .intro-card .when { margin-top: .3rem; font-family: var(--display); font-weight: 700; letter-spacing: .06em; }
  .intro.open .intro-card { transform: translateY(-40px) scale(1.04); opacity: 0; }
  .intro.open { opacity: 0; pointer-events: none; }
  .intro.gone { display: none; }

  .petal { position: fixed; top: -40px; z-index: 60; pointer-events: none; animation: fall linear forwards; }
  .petal svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 2px 2px rgba(80,40,20,.18)); animation: flutter var(--fl, 2.4s) ease-in-out infinite alternate; }
  @keyframes fall { to { transform: translate(var(--drift), 112vh); } }
  @keyframes flutter { from { transform: rotate(var(--r0)) rotateY(0deg); } to { transform: rotate(var(--r1)) rotateY(55deg); } }
  .music {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 40;
    width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--gold); cursor: pointer;
    background: var(--maroon); color: #FFF6EA; font-size: 1.25rem; box-shadow: 0 4px 12px rgba(0,0,0,.35);
  }
  .music[aria-pressed="false"] { opacity: .7; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
    .foot, .twinkle { opacity: 1; }
    .float-up { display: none; }
  }
</style>

const f = (o, loc = "en-GB") => new Intl.DateTimeFormat(loc, { timeZone: "Asia/Kolkata", ...o }).format(start);
const day = +f({ day: "numeric" });
const ord = n => n + (n % 10 === 1 && n !== 11 ? "st" : n % 10 === 2 && n !== 12 ? "nd" : n % 10 === 3 && n !== 13 ? "rd" : "th");
const time = f({ hour: "numeric", minute: "2-digit", hour12: true }, "en-US");
const V = {
  ...INVITE,
  weekdayCaps: f({ weekday: "long" }).toUpperCase(),
  dateCaps: `${ord(day)} ${f({ month: "long" })} ${f({ year: "numeric" })}`.toUpperCase(),
  timeCaps: time.toUpperCase(),
  venueCaps: "AT " + INVITE.venueName.toUpperCase(),
  shortDate: `${f({ weekday: "long" })}, ${ord(day)} ${f({ month: "long" })} ${f({ year: "numeric" })}, ${time}`,
};
document.querySelectorAll("[data-k]").forEach(el => { el.textContent = V[el.dataset.k] || ""; });
document.getElementById("venue-h").textContent = INVITE.venueName.toUpperCase();
const namesEl = document.getElementById("names");
INVITE.names.forEach((n, i) => {
  if (i) { const a = document.createElement("span"); a.className = "and"; a.textContent = "&"; namesEl.append(a); }
  namesEl.append(document.createTextNode(n.toUpperCase()));
});

/* ---------- Drawings ---------- */
const NS = "http://www.w3.org/2000/svg";
const qpt = (a, c, b, t) => [(1 - t) ** 2 * a[0] + 2 * t * (1 - t) * c[0] + t * t * b[0], (1 - t) ** 2 * a[1] + 2 * t * (1 - t) * c[1] + t * t * b[1]];
const marigold = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#F39A1E"/><circle cx="${x}" cy="${y}" r="${r * .62}" fill="#F7B733"/><circle cx="${x}" cy="${y}" r="${r * .25}" fill="#D86E0C"/>`;

// Gold and pearl toran across the top of each card
document.querySelectorAll("[data-garland]").forEach(svg => {
  let s = "";
  const joins = [[78, 4], [158, 4], [242, 4], [322, 4]];
  const lotus = (x, y, r) => `<path d="M${x} ${y} C${x + r} ${y + r * 1.2} ${x + r * .6} ${y + r * 2.2} ${x} ${y + r * 2.8} C${x - r * .6} ${y + r * 2.2} ${x - r} ${y + r * 1.2} ${x} ${y}Z" fill="#D2A85A" stroke="#9C7330" stroke-width=".5"/><path d="M${x} ${y + r * .6} V${y + r * 2.3}" stroke="#F3DDA8" stroke-width=".6"/>`;
  for (let k = 0; k < joins.length - 1; k++) {
    const a = joins[k], b = joins[k + 1], c = [(a[0] + b[0]) / 2, 40];
    s += `<path d="M${a[0]} ${a[1]} Q${c[0]} ${c[1]} ${b[0]} ${b[1]}" fill="none" stroke="#C59A4E" stroke-width="1.1"/>`;
    s += `<path d="M${a[0]} ${a[1] + 5} Q${c[0]} ${c[1] + 10} ${b[0]} ${b[1] + 5}" fill="none" stroke="#C59A4E" stroke-width=".6" stroke-dasharray="1 3" stroke-linecap="round"/>`;
    for (let t = 0.07; t < 0.95; t += 0.072) {
      const [x, y] = qpt(a, c, b, t);
      s += `<circle cx="${x}" cy="${y}" r="1.9" fill="#FFF8EC" stroke="#C59A4E" stroke-width=".5"/>`;
    }
    const [mx, my] = qpt(a, c, b, .5);
    s += `<path d="M${mx} ${my} V${my + 10}" stroke="#C59A4E" stroke-width=".7"/><circle cx="${mx}" cy="${my + 12}" r="2.2" fill="#FFF8EC" stroke="#C59A4E" stroke-width=".5"/><circle cx="${mx}" cy="${my + 17}" r="1.6" fill="#E7A9B6"/>`;
  }
  joins.slice(1, -1).forEach(([x, y]) => {
    s += `<path d="M${x} ${y} V${y + 16}" stroke="#C59A4E" stroke-width=".8"/>` + lotus(x, y + 16, 4.5) + `<circle cx="${x}" cy="${y + 33}" r="2.2" fill="#FFF8EC" stroke="#C59A4E" stroke-width=".5"/>`;
  });
  svg.innerHTML = s;
});

// Prabhavali (arch of light) around Ganesha
(() => {
  let s = `<path d="M38 470 V260 C38 110 150 -4 265 -14 C380 -4 492 110 492 260 V470" fill="none" stroke="#C59A4E" stroke-width="2.4"/>`;
  s += `<path d="M24 470 V258 C24 96 146 -20 265 -30 C384 -20 506 96 506 258 V470" fill="none" stroke="#C59A4E" stroke-width="1.2" stroke-dasharray="2 7" stroke-linecap="round"/>`;
  // flame tongues along the arch
  const pts = [];
  for (let t = 0; t <= 1.0001; t += 1 / 22) {
    const ang = Math.PI * (1 - t); // 180° to 0°
    pts.push([265 + 240 * Math.cos(ang), 250 - 270 * Math.sin(ang), ang]);
  }
  pts.forEach(([x, y, a], i) => {
    const nx = Math.cos(a), ny = -Math.sin(a);
    const tipx = x + nx * 22, tipy = y + ny * 22;
    s += `<path d="M${x - ny * 6} ${y + nx * 6} Q${x + nx * 12 - ny * 5} ${y + ny * 12 + nx * 5} ${tipx} ${tipy} Q${x + nx * 12 + ny * 5} ${y + ny * 12 - nx * 5} ${x + ny * 6} ${y - nx * 6}Z" fill="#D9AD5E" opacity=".85"/>`;
  });
  [[20, 470], [510, 470]].forEach(([x, y]) => s += `<path d="M${x - 12} ${y} h24 l-4 -10 h-16Z" fill="#C59A4E"/>`);
  const star = (x, y, r, d) => `<path class="twinkle" style="animation-delay:${d}s" d="M${x} ${y - r} L${x + r * .28} ${y - r * .28} L${x + r} ${y} L${x + r * .28} ${y + r * .28} L${x} ${y + r} L${x - r * .28} ${y + r * .28} L${x - r} ${y} L${x - r * .28} ${y - r * .28}Z" fill="#E8C77E"/>`;
  s += star(70, 60, 12, 0) + star(470, 70, 10, -1) + star(30, 180, 8, -1.8) + star(500, 200, 9, -.6) + star(120, -10, 7, -1.2) + star(420, -6, 8, -2);
  document.getElementById("prabha").innerHTML = s;
})();

// Gold rangoli line under the address
(() => {
  let s = `<path d="M10 30 H86 M154 30 H230" stroke="#C59A4E" stroke-width="1"/>`;
  for (let i = 0; i < 8; i++) s += `<ellipse cx="120" cy="16" rx="5" ry="14" fill="none" stroke="#C59A4E" stroke-width="1" transform="rotate(${i * 45} 120 30)"/>`;
  s += `<circle cx="120" cy="30" r="5" fill="#E58FAE"/><circle cx="120" cy="30" r="22" fill="none" stroke="#C59A4E" stroke-width=".8" stroke-dasharray="1 3"/>`;
  s += `<circle cx="92" cy="30" r="2.5" fill="#F39A1E"/><circle cx="148" cy="30" r="2.5" fill="#F39A1E"/><circle cx="6" cy="30" r="2" fill="#C59A4E"/><circle cx="234" cy="30" r="2" fill="#C59A4E"/>`;
  document.getElementById("rangoli").innerHTML = s;
})();

// Scattered petals at the bottom of each card
document.querySelectorAll("[data-petals]").forEach(el => {
  const kinds = [["fl-lotus", 9, 18], ["fl-jas", 16, 16], ["fl-petal", 13, 15], ["fl-lotus", 9, 18], ["fl-jas", 13, 13], ["fl-bud", 10, 17], ["fl-lotus", 8, 16], ["fl-jas", 15, 15]];
  kinds.forEach(([id, w, h], i) => {
    el.insertAdjacentHTML("beforeend", `<svg style="left:${4 + i * 12}%;top:${4 + (i % 3) * 7}px;width:${w}px;height:${h}px;transform:rotate(${Math.round(Math.random() * 140 - 70)}deg)" aria-hidden="true"><use href="#${id}"/></svg>`);
  });
});

// Cradle: garland on the beam and dots on the cradle body
(() => {
  let s = "";
  [[[56, 84], [104, 108], [160, 58]], [[264, 84], [216, 108], [160, 58]]].forEach(([a, c, b]) => {
    for (let t = 0; t <= 1.001; t += 1 / 11) { const [x, y] = qpt(a, c, b, t); s += marigold(x, y, 4.2); }
  });
  document.getElementById("beam-garland").innerHTML = s;
  let d = "";
  for (let t = 0.06; t < 0.95; t += 0.09) { const [x, y] = qpt([92, 184], [160, 240], [228, 184], t); d += `<circle cx="${x}" cy="${y - 4}" r="1.8" fill="#8E6527"/>`; }
  document.getElementById("cradle-dots").innerHTML = d;
})();

// Hearts rising from the baby bump, sparkles around the couple
(() => {
  const host = document.getElementById("couple");
  for (let i = 0; i < 5; i++) {
    const h = document.createElement("span");
    h.className = "float-up"; h.textContent = "♥";
    h.style.color = i % 2 ? "#E58FAE" : "#D98BA0";
    h.style.left = 36 + i * 4 + "%"; h.style.animationDelay = i * .9 + "s";
    host.append(h);
  }
  [[8, 12], [86, 8], [4, 52], [90, 46], [14, 82], [84, 80]].forEach(([x, y], i) => {
    const sp = document.createElement("span");
    sp.className = "spark"; sp.textContent = "✦";
    sp.style.left = x + "%"; sp.style.top = y + "%"; sp.style.animationDelay = -i * .45 + "s";
    host.append(sp);
  });
})();

// Hearts and stars floating up from the sleeping baby
(() => {
  const host = document.getElementById("palna");
  for (let i = 0; i < 6; i++) {
    const h = document.createElement("span");
    h.className = "float-up"; h.textContent = i % 2 ? "♥" : "✦";
    h.style.color = i % 2 ? "#E58FAE" : "#C59A4E";
    h.style.left = 34 + i * 6 + "%"; h.style.top = "42%";
    h.style.animationDelay = i * .75 + "s";
    host.append(h);
  }
})();

// Seemantha bangles
(() => {
  const cols = ["#1E8E5A", "#B3122E", "#C59A4E", "#1E8E5A", "#C59A4E", "#B3122E", "#1E8E5A"];
  let s = `<svg viewBox="0 0 90 110" aria-hidden="true">`;
  cols.forEach((c, i) => {
    const y = 26 + i * 10;
    s += `<ellipse cx="45" cy="${y}" rx="34" ry="8" fill="none" stroke="${c}" stroke-width="6"/>`;
    s += `<ellipse class="shine" cx="45" cy="${y}" rx="34" ry="8" fill="none" stroke="#FFF8DC" stroke-width="1.6" style="animation-delay:${-i * .35}s"/>`;
  });
  document.querySelectorAll(".bangles").forEach(b => b.innerHTML = s + "</svg>");
})();

// Baby footprints
(() => {
  const foot = flip => `<svg viewBox="0 0 22 38"><g ${flip ? 'transform="translate(22 0) scale(-1 1)"' : ""} fill="#D98BA0">
    <path d="M11 8 C17 8 19 16 18 24 C17 32 14 37 11 37 C7 37 5 32 5 26 C5 18 6 8 11 8Z"/>
    <circle cx="5.5" cy="5" r="2.3"/><circle cx="9.5" cy="3" r="2"/><circle cx="13" cy="2.8" r="1.8"/><circle cx="16" cy="4" r="1.6"/><circle cx="18.3" cy="6.4" r="1.4"/></g></svg>`;
  const wrap = document.getElementById("feet");
  for (let i = 0; i < 6; i++) {
    const s = document.createElement("span");
    s.className = "foot"; s.style.animationDelay = i * 0.5 + "s"; s.innerHTML = foot(i % 2);
    wrap.append(s);
  }
})();

/* ---------- Links ---------- */
const place = `${INVITE.venueName}, ${INVITE.venueAddress}`;
const title = `Seemantha – ${INVITE.names.join(" & ")}`;
const gcal = d => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
document.getElementById("cal-link").href =
  `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${enc(title)}&dates=${gcal(start)}/${gcal(end)}&details=${enc(location.href)}&location=${enc(place)}`;
const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${enc(INVITE.mapQuery)}`;
document.getElementById("dir-link").href = mapsUrl;
document.getElementById("map-art").href = mapsUrl;
document.getElementById("share").href =
  `https://wa.me/?text=${enc(`You’re invited to the Seemantha ceremony of ${INVITE.names.join(" & ")} on ${V.shortDate}, at ${INVITE.venueName}. ${location.href}`)}`;
if (INVITE.rsvpWhatsApp) {
  const r = document.getElementById("rsvp");
  r.href = `https://wa.me/${INVITE.rsvpWhatsApp}?text=${enc(`Namaskara! We will attend the Seemantha on ${V.shortDate}.`)}`;
  r.hidden = false;
}
const liveBtn = document.getElementById("live-btn"), liveMap = document.getElementById("live-map");
liveBtn.addEventListener("click", () => {
  const show = liveMap.hidden;
  if (show && !liveMap.firstChild) {
    liveMap.innerHTML = `<iframe title="Live map of the venue" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
      src="https://maps.google.com/maps?q=${enc(INVITE.mapQuery)}&t=&z=16&ie=UTF8&iwloc=&output=embed"></iframe>`;
  }
  liveMap.hidden = !show;
  liveBtn.textContent = show ? "HIDE LIVE MAP" : "SHOW LIVE MAP";
  liveBtn.setAttribute("aria-expanded", show);
});

/* ---------- Countdown ---------- */
const cd = document.getElementById("countdown");
function tick() {
  const now = Date.now();
  if (now >= end) { cd.innerHTML = "<p>Thank you for your blessings.</p>"; return; }
  if (now >= start) { cd.innerHTML = "<p>The ceremony is happening now.</p>"; return; }
  let t = Math.floor((start - now) / 1000);
  const d = Math.floor(t / 86400); t -= d * 86400;
  const h = Math.floor(t / 3600); t -= h * 3600;
  const m = Math.floor(t / 60); const s = t - m * 60;
  cd.innerHTML = [[d, "DAYS"], [h, "HOURS"], [m, "MINS"], [s, "SECS"]]
    .map(([n, l]) => `<div class="ring"><b>${String(n).padStart(2, "0")}</b><small>${l}</small></div>`).join("");
}
tick(); setInterval(tick, 1000);

const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .12 });
document.querySelectorAll(".reveal").forEach(el => io.observe(el));

/* ---------- Petals ---------- */
function petal() {
  const kinds = [["fl-jas", 16, 22], ["fl-jas", 14, 20], ["fl-petal", 13, 18], ["fl-lotus", 9, 13], ["fl-bud", 11, 14]];
  const [id, min, max] = kinds[Math.floor(Math.random() * kinds.length)];
  const p = document.createElement("i");
  p.className = "petal";
  p.style.width = min + Math.random() * (max - min) + "px";
  p.style.left = Math.random() * 100 + "vw";
  p.style.animationDuration = 7 + Math.random() * 5 + "s";
  p.style.setProperty("--drift", Math.random() * 160 - 80 + "px");
  p.style.setProperty("--fl", 1.6 + Math.random() * 1.8 + "s");
  const r = Math.random() * 360;
  p.style.setProperty("--r0", r + "deg"); p.style.setProperty("--r1", r + 120 + Math.random() * 120 + "deg");
  p.innerHTML = `<svg viewBox="${id === "fl-jas" ? "-20 -20 40 40" : id === "fl-petal" ? "0 0 30 34" : id === "fl-bud" ? "0 0 24 40" : "0 0 20 40"}" aria-hidden="true"><use href="#${id}"/></svg>`;
  p.addEventListener("animationend", e => { if (e.target === p) p.remove(); });
  document.body.append(p);
}
function shower(n) { for (let i = 0; i < n; i++) setTimeout(petal, Math.random() * 2200); }

/* ---------- Music (optional music.mp3) ---------- */
const audio = document.getElementById("audio"), musicBtn = document.getElementById("music");
function setMusic(on) { musicBtn.setAttribute("aria-pressed", on); musicBtn.setAttribute("aria-label", on ? "Pause music" : "Play music"); }
musicBtn.addEventListener("click", () => { if (audio.paused) { audio.play(); setMusic(true); } else { audio.pause(); setMusic(false); } });

/* ---------- Open ---------- */
const intro = document.getElementById("intro"), openBtn = document.getElementById("open-btn");
openBtn.focus();
openBtn.addEventListener("click", () => {
  intro.classList.add("open");
  document.body.classList.remove("locked");
  if (!reduce) { shower(36); setInterval(() => { if (!document.hidden) petal(); }, 1800); }
  audio.play().then(() => { musicBtn.hidden = false; setMusic(true); }).catch(() => {});
  setTimeout(() => intro.classList.add("gone"), reduce ? 0 : 1000);
});
</script>
